name: SonarCloud Scan

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # important for SonarCloud

      # ------------------------
      # Setup Java (Backend)
      # ------------------------
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # ------------------------
      # Setup Node (Frontend)
      # ------------------------
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # ------------------------
      # FRONTEND BUILD
      # ------------------------
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # ------------------------
      # BACKEND BUILD (SKIP TESTS)
      # ------------------------
      - name: Build Backend
        working-directory: ./backend
        run: mvn clean verify -DskipTests

      # ------------------------
      # SONARCLOUD SCAN (FIXED)
      # ------------------------
      - name: SonarCloud Scan
        working-directory: ./backend
        run: mvn sonar:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=Ha1qua \
          -Dsonar.projectKey=Contact_Management_System \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}