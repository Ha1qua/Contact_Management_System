name: CMS CI/CD

on:
  pull_request:
    branches:
      - main

jobs:

  frontend-build:
    name: Frontend Build and Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ha1qua/contact-management-frontend:pr-${{ github.event.pull_request.number }} \
            ./frontend

      - name: Save frontend Docker image
        run: |
          docker save \
            ha1qua/contact-management-frontend:pr-${{ github.event.pull_request.number }} \
            -o frontend-image.tar

      - name: Upload frontend Docker image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-image
          path: frontend-image.tar
          retention-days: 1


  backend-build:
    name: Backend Build and Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test backend
        working-directory: ./backend
        run: ./mvnw test

      - name: Build backend
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Build backend Docker image
        working-directory: ./backend
        run: |
          docker build \
            -t ha1qua/contact-management-backend:pr-${{ github.event.pull_request.number }} \
            .

      - name: Save backend Docker image
        run: |
          docker save \
            ha1qua/contact-management-backend:pr-${{ github.event.pull_request.number }} \
            -o backend-image.tar

      - name: Upload backend Docker image
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar
          retention-days: 1


  pr-check:
    name: PR Check
    needs:
      - frontend-build
      - backend-build
    runs-on: ubuntu-latest

    steps:
      - name: Docker builds passed
        run: echo "Frontend and Backend Docker images built successfully"


  push-images:
    name: Push Docker Images
    needs:
      - frontend-build
      - backend-build
      - pr-check
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend Docker image
        uses: actions/download-artifact@v4
        with:
          name: frontend-docker-image

      - name: Download backend Docker image
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image

      - name: Load frontend Docker image
        run: |
          docker load -i frontend-image.tar

      - name: Load backend Docker image
        run: |
          docker load -i backend-image.tar

      - name: Generate image version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag frontend image
        run: |
          docker tag \
            ha1qua/contact-management-frontend:pr-${{ github.event.pull_request.number }} \
            ha1qua/contact-management-frontend:v${VERSION}

          docker tag \
            ha1qua/contact-management-frontend:pr-${{ github.event.pull_request.number }} \
            ha1qua/contact-management-frontend:latest

      - name: Tag backend image
        run: |
          docker tag \
            ha1qua/contact-management-backend:pr-${{ github.event.pull_request.number }} \
            ha1qua/contact-management-backend:v${VERSION}

          docker tag \
            ha1qua/contact-management-backend:pr-${{ github.event.pull_request.number }} \
            ha1qua/contact-management-backend:latest

      - name: Push frontend images
        run: |
          docker push ha1qua/contact-management-frontend:v${VERSION}
          docker push ha1qua/contact-management-frontend:latest

      - name: Push backend images
        run: |
          docker push ha1qua/contact-management-backend:v${VERSION}
          docker push ha1qua/contact-management-backend:latest